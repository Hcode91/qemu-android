import groovy.json.JsonOutput
allprojects {
    afterEvaluate { project ->
        if (project.name == 'app') {
            tasks.register('exportSecurityDependencies') {
                doLast {
                    def coordinates = [] as Set
                    ['debugRuntimeClasspath', 'releaseRuntimeClasspath', 'debugUnitTestRuntimeClasspath'].each { config ->
                        project.configurations.getByName(config).resolvedConfiguration.resolvedArtifacts.each { artifact ->
                            def id = artifact.moduleVersion.id
                            coordinates.add([name: "${id.group}:${id.name}", version: id.version])
                        }
                    }
                    def output = rootProject.file('reports/gradle-dependencies.json')
                    output.parentFile.mkdirs()
                    output.text = JsonOutput.prettyPrint(JsonOutput.toJson(coordinates.toList().sort { it.name }))
                }
            }
        }
    }
}
