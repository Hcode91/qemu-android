name: Android guest compatibility research
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['android/aosp/**', '.github/workflows/android-guest-compat.yml']
  pull_request:
    paths: ['android/aosp/**', '.github/workflows/android-guest-compat.yml']
permissions:
  contents: read
concurrency:
  group: android-guest-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit pinned AOSP 4.1.2 source requirements
        run: python3 android/aosp/audit-sources.py
      - name: Install kernel build and host-QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev libc6-i386 lib32stdc++6 lib32z1 qemu-system-arm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            android/.aosp-kernel/kernel
            android/.aosp-kernel/compiler
          key: android-guest-sources-${{ runner.os }}-${{ hashFiles('android/aosp/sources.json') }}
      - name: Build and boot real ARM kernel compatibility probe
        run: bash android/aosp/build-kernel-probe.sh
      - name: Kernel, source and guest-output evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QEMU-Android-JellyBean-prerequisites-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            android/reports/aosp-source/
            android/reports/aosp-kernel/
          retention-days: 14
      - name: State verification scope
        if: always()
        run: echo 'Kernel ABI research only. No Android userspace build, Android boot, new phone image or APK is established by this workflow.' >> "$GITHUB_STEP_SUMMARY"
