# Keep the upstream mirror policy scoped to the upstream mirror.
name: Repo Lockdown
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  action:
    if: github.repository == 'qemu/qemu'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Upstream QEMU contributions use GitLab and the mailing list. Downstream Android PRs belong in Hcode91/qemu-android.'
