name: Pinned Android build environment
description: Install SDK, NDK, JDK and CI build tools
inputs:
  read-only-cache:
    description: Restrict Gradle cache writes
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17.0.17+10'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        gradle-version: '8.11.1'
        cache-read-only: ${{ inputs.read-only-cache }}
    - name: Select Android SDK root
      shell: bash
      run: |
        set -euo pipefail
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root unavailable}}" >> "$GITHUB_ENV"
    - name: Install pinned SDK command-line tools and Android packages
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        cmdline-tools-version: '12266719' # 16.0, compatible with JDK 17
        log-accepted-android-sdk-licenses: false
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'
    - name: Install native build tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config autoconf automake libtool gettext python3-venv flex bison
        python3 -m venv "$RUNNER_TEMP/qemu-tools"
        "$RUNNER_TEMP/qemu-tools/bin/pip" install -r android/ci/requirements.txt
        echo "$RUNNER_TEMP/qemu-tools/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: android/.native/src
        key: android-native-sources-${{ runner.os }}-${{ hashFiles('android/ci/native-deps.json') }}
